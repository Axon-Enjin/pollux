<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fake map · synthetic</title>
  <style>
    body {
      margin: 0;
      background: #e9eef5;
      font-family: "Segoe UI", sans-serif;
      color: #111;
    }
    .stamp {
      background: #9B2C2C;
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 8px;
    }
    .thread { max-width: 420px; margin: 0 auto; padding: 16px; }
    .bubble {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .who { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .map {
      height: 140px;
      border: 2px dashed #9B2C2C;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      color: #9B2C2C;
      margin: 8px 0;
      background: #f8ecec;
    }
    .caption { font-size: 14px; }
    h1 { font-size: 16px; margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="stamp">SYNTHETIC · quarantine / not canon · not an order</div>
  <div class="thread">
    <h1>Barangay chat (demo)</h1>
    <div class="bubble">
      <div class="who">Unknown · 2:11 a.m.</div>
      <div class="map">FAKE MAP<br />evacuation routes<br />looks official</div>
      <p class="caption">LGU just dropped the official evacuation map. Forward now. Official na ito.</p>
    </div>
    <div class="bubble">
      <div class="who">Neighbor</div>
      <p class="caption">Sharing. Looks real.</p>
    </div>
  </div>
</body>
</html>
